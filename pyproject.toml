[project]
name = "pbgc-caseworkbench-2"
version = "0.1.0"
description = "Deterministic PBGC V1 compiler and validation framework"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
pbgc-caseworkbench = "pbgc_caseworkbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
